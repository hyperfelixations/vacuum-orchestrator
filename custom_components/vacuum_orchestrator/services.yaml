create_job:
  fields:
    areas:
      selector:
        area:
          multiple: true
    rooms:
      selector:
        text:
          multiple: true
    all_rooms:
      selector:
        boolean: {}
    mode:
      selector:
        select:
          translation_key: mode
          options:
          - vacuum
          - mop
          - vacuum_and_mop
          - vacuum_then_mop
    name:
      selector:
        text: null
    vacuum_power:
      selector: &id001
        select:
          translation_key: vacuum_power
          options:
          - low
          - standard
          - high
          - maximum
          - maximum_plus
    mop_intensity:
      selector: &water_levels
        select:
          translation_key: mop_intensity
          options:
          - low
          - medium
          - high
    mop_route:
      selector:
        select:
          translation_key: mop_route
          options:
          - fast
          - standard
          - deep
          - deep_plus
    passes:
      selector:
        number:
          min: 1
          max: 10
          mode: box
    reason:
      selector:
        text: null
    note:
      selector:
        text:
          multiline: true
    dedupe_key:
      selector:
        text: null
    required_on:
      selector:
        entity:
          multiple: true
    required_off:
      selector:
        entity:
          multiple: true
    settings_policy:
      selector:
        select:
          translation_key: settings_policy
          options:
          - best_effort
          - strict
    start:
      default: false
      selector:
        boolean: {}
    robot_id:
      selector:
        entity:
          filter:
            domain: vacuum
update_job:
  fields:
    job_id: &id002
      required: true
      selector:
        text: null
    areas:
      selector:
        area:
          multiple: true
    rooms:
      selector:
        text:
          multiple: true
    all_rooms:
      selector:
        boolean: {}
    mode:
      selector:
        select:
          translation_key: mode
          options:
          - vacuum
          - mop
          - vacuum_and_mop
          - vacuum_then_mop
    name:
      selector:
        text: null
    vacuum_power:
      selector: *id001
    mop_intensity:
      selector: *water_levels
    mop_route:
      selector:
        select:
          translation_key: mop_route
          options:
          - fast
          - standard
          - deep
          - deep_plus
    passes:
      selector:
        number:
          min: 1
          max: 10
          mode: box
    reason:
      selector:
        text: null
    note:
      selector:
        text:
          multiline: true
    dedupe_key:
      selector:
        text: null
    required_on:
      selector:
        entity:
          multiple: true
    required_off:
      selector:
        entity:
          multiple: true
    settings_policy:
      selector:
        select:
          translation_key: settings_policy
          options:
          - best_effort
          - strict
    hold_id:
      advanced: true
      selector:
        text:
delete_job:
  fields:
    job_id: *id002
    hold_id:
      advanced: true
      selector:
        text:
move_job:
  fields:
    job_id: *id002
    direction:
      required: true
      selector:
        select:
          translation_key: direction
          options:
          - up
          - down
          - top
          - bottom
start_job:
  fields:
    job_id: *id002
    robot_id:
      selector:
        entity:
          filter:
            domain: vacuum
run_queue:
pause_queue:
resume_queue:
end_queue:
  fields:
    running_jobs:
      default: finish
      selector:
        select:
          translation_key: running_jobs
          options:
          - finish
          - cancel
    after_cancel:
      default: stay
      selector:
        select:
          translation_key: after_cancel
          options:
          - stay
          - return_to_dock
cancel_job:
  fields:
    job_id: *id002
    after_cancel:
      default: stay
      selector:
        select:
          translation_key: after_cancel
          options:
          - stay
          - return_to_dock
return_robot:
  fields:
    robot_id:
      required: true
      selector:
        entity:
          filter:
            domain: vacuum
retry_job:
  fields:
    job_id: *id002
correct_job:
  fields:
    job_id: *id002
    outcome:
      required: true
      selector:
        select:
          translation_key: outcome
          options:
            - completed
            - failed
get_queue:
  fields:
    offset:
      default: 0
      selector: &id008
        number:
          min: 0
          mode: box
    limit:
      default: 50
      selector: &id009
        number:
          min: 1
          max: 100
          mode: box
get_job:
  fields:
    job_id: *id002
configure_queue:
  fields:
    grace_seconds:
      required: false
      selector:
        duration: {}
    start_delay_seconds:
      required: false
      selector:
        duration: {}
configure_job_defaults:
  fields:
    mode:
      selector:
        select:
          translation_key: mode
          options:
          - vacuum
          - mop
          - vacuum_and_mop
          - vacuum_then_mop
    vacuum_power:
      selector: *id001
    mop_intensity:
      selector: *water_levels
    mop_route:
      selector:
        select:
          translation_key: mop_route
          options:
          - fast
          - standard
          - deep
          - deep_plus
    passes:
      selector:
        number:
          min: 1
          max: 10
          mode: box
    settings_policy:
      selector:
        select:
          translation_key: settings_policy
          options:
          - best_effort
          - strict
create_room:
  fields:
    name:
      required: true
      selector:
        text: {}
    area_id:
      required: false
      selector:
        area: {}
update_room:
  fields:
    room_id: &id004
      required: true
      selector:
        text: {}
    configuration:
      required: true
      selector:
        object: {}
disable_room:
  fields: &id005
    room_id: *id004
enable_room:
  fields: *id005
release_room:
  fields:
    areas:
      selector:
        area:
          multiple: true
    rooms:
      selector:
        text:
          multiple: true
    kind:
      required: true
      selector:
        select:
          translation_key: kind
          options:
          - permanent
          - once
          - timed
          - queue_run
    duration_seconds:
      selector:
        duration: {}
revoke_room:
  fields:
    areas:
      selector:
        area:
          multiple: true
    rooms:
      selector:
        text:
          multiple: true
add_robot:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          filter:
            domain: vacuum
    name:
      required: false
      selector:
        text: {}
configure_robot:
  fields:
    robot_id: &id006
      required: true
      selector:
        entity:
          filter:
            domain: vacuum
    configuration:
      required: true
      selector:
        object: {}
remove_robot:
  fields:
    robot_id: *id006
rename_robot:
  fields:
    robot_id: *id006
    name:
      required: false
      selector:
        text: {}
resolve_recovery:
  fields:
    robot_id: *id006
    confirm_stopped:
      default: false
      selector:
        boolean: {}
save_template:
  fields:
    template_id:
      required: false
      selector:
        text: {}
    name:
      required: true
      selector:
        text: {}
    intent:
      required: true
      selector:
        object: {}
    enabled:
      default: true
      selector:
        boolean: {}
    automatic:
      default: false
      selector:
        boolean: {}
save_job_as_template:
  fields:
    job_id:
      required: true
      selector:
        text: {}
    name:
      required: true
      selector:
        text: {}
    automatic:
      default: false
      selector:
        boolean: {}
remove_template:
  fields: &id007
    template_id:
      required: true
      selector:
        text: {}
create_job_from_template:
  fields: *id007
reset_template_demand:
  fields: *id007
get_rooms:
  fields: &id010
    offset: &id011
      default: 0
      selector: *id008
    limit: &id012
      default: 50
      selector: *id009
get_robots:
  fields: *id010
get_robot_candidates:
  fields: *id010
get_templates:
  fields: *id010
get_history:
  fields: *id010
get_room:
  fields: *id005
validate:
  fields:
    command:
      required: true
      selector:
        select:
          options:
          - create_job
          - update_job
          - save_template
          - create_room
          - update_room
          - release_rooms
          - configure_queue
          - configure_job_defaults
          - add_robot
          - configure_robot
          - rename_robot
    data:
      required: true
      selector:
        object: {}
get_trace:
  fields:
    offset: *id011
    limit: *id012
    job_id:
      required: false
      selector:
        text: {}
get_diagnostics:
get_setup:
get_job_execution:
  fields:
    job_id:
      required: true
      selector:
        text: {}
