create_job:
  name: Create job
  description: Create a cleaning job and append it to the global queue. Omitted mode,
    settings, passes and settings policy take the job defaults.
  fields:
    areas:
      name: Room or area IDs
      description: Canonical VOI room IDs or Home Assistant area IDs, or "all" for
        every enabled room whose area exists. Use get_rooms to discover IDs.
      required: true
      selector:
        object: {}
    mode:
      name: Cleaning mode
      selector:
        select:
          options:
          - vacuum
          - mop
          - vacuum_and_mop
          - vacuum_then_mop
    name:
      name: Name
      selector:
        text: null
    vacuum_power:
      name: Vacuum power
      selector: &id001
        select:
          options:
          - low
          - standard
          - high
          - maximum
          - maximum_plus
    mop_intensity:
      name: Mop intensity
      selector: &water_levels
        select:
          options:
          - low
          - medium
          - high
    mop_route:
      name: Mop route
      selector:
        select:
          options:
          - fast
          - standard
          - deep
          - deep_plus
    passes:
      name: Passes
      selector:
        number:
          min: 1
          max: 10
          mode: box
    reason:
      name: Reason
      selector:
        text: null
    note:
      name: Note
      selector:
        text:
          multiline: true
    dedupe_key:
      name: Deduplication key
      selector:
        text: null
    required_on:
      name: Required on
      selector:
        entity:
          multiple: true
    required_off:
      name: Required off
      selector:
        entity:
          multiple: true
    settings_policy:
      name: Settings policy
      selector:
        select:
          options:
          - best_effort
          - strict
    start:
      name: Start now
      description: Create and start the job in one step. If it cannot start now,
        nothing is created.
      default: false
      selector:
        boolean: {}
    robot_id:
      name: Robot ID
      description: Only with start; otherwise VOI chooses the robot.
      selector:
        text: {}
update_job:
  name: Update job
  description: Change only the supplied fields of a queued job.
  fields:
    job_id: &id002
      name: Job ID
      required: true
      selector:
        text: null
    areas:
      name: Room or area IDs
      description: Canonical VOI room IDs or Home Assistant area IDs, or "all" for
        every enabled room whose area exists. Use get_rooms to discover IDs.
      required: false
      selector:
        object: {}
    mode:
      name: Cleaning mode
      selector:
        select:
          options:
          - vacuum
          - mop
          - vacuum_and_mop
          - vacuum_then_mop
    name:
      name: Name
      selector:
        text: null
    vacuum_power:
      name: Vacuum power
      selector: *id001
    mop_intensity:
      name: Mop intensity
      selector: *water_levels
    mop_route:
      name: Mop route
      selector:
        select:
          options:
          - fast
          - standard
          - deep
          - deep_plus
    passes:
      name: Passes
      selector:
        number:
          min: 1
          max: 10
          mode: box
    reason:
      name: Reason
      selector:
        text: null
    note:
      name: Note
      selector:
        text:
          multiline: true
    dedupe_key:
      name: Deduplication key
      selector:
        text: null
    required_on:
      name: Required on
      selector:
        entity:
          multiple: true
    required_off:
      name: Required off
      selector:
        entity:
          multiple: true
    settings_policy:
      name: Settings policy
      selector:
        select:
          options:
          - best_effort
          - strict
delete_job:
  name: Delete job
  description: Delete a queued or terminal job.
  fields: &id003
    job_id: *id002
move_job:
  name: Move job
  description: Move a queued job up, down, to the top, or to the bottom.
  fields:
    job_id: *id002
    direction:
      name: Direction
      required: true
      selector:
        select:
          options:
          - up
          - down
          - top
          - bottom
start_job:
  name: Start job
  description: Start one queued job on the best robot or an optional selected robot.
  fields:
    job_id: *id002
    robot_id:
      name: Robot ID
      selector:
        text: null
run_queue:
  name: Run queue
  description: Enable automatic queue processing and dispatch safe jobs.
pause_queue:
  name: Pause queue
  description: Prevent new automatic dispatches without interrupting active work.
resume_queue:
  name: Resume queue
  description: Resume automatic queue processing and dispatch safe jobs.
end_queue:
  name: End queue
  description: End the current queue run. Waiting jobs stay queued. With finish, started
    jobs (including a pending mopping phase) complete first and the run then closes
    without a grace period; with cancel, they are cancelled and the run closes now.
  fields:
    running_jobs:
      name: Started jobs
      default: finish
      selector:
        select:
          options:
          - finish
          - cancel
    after_cancel:
      name: After cancelling
      default: stay
      selector:
        select:
          options:
          - stay
          - return_to_dock
cancel_job:
  name: Cancel job
  description: Cancel queued work or safely stop an active attempt. With return_to_dock
    the robot then drives home; the cancel completes once it rests at the dock.
  fields:
    job_id: *id002
    after_cancel:
      name: After cancelling
      default: stay
      selector:
        select:
          options:
          - stay
          - return_to_dock
return_robot:
  name: Return robot to dock
  description: Send a robot that is not running a job back to its dock.
  fields:
    robot_id:
      name: Robot ID
      required: true
      selector:
        text: {}
retry_job:
  name: Retry job
  description: Create a new queued job from a terminal job.
  fields: *id003
get_queue:
  name: Get queue
  description: Return a bounded page from the global pending queue.
  fields:
    offset:
      name: Offset
      default: 0
      selector: &id008
        number:
          min: 0
          mode: box
    limit:
      name: Limit
      default: 50
      selector: &id009
        number:
          min: 1
          max: 100
          mode: box
get_job:
  name: Get job
  description: Return one job including its complete public intent.
  fields: *id003
configure_queue:
  name: Configure queue
  description: Set the idle grace period for future queue runs; blocked pending jobs
    do not keep a run open.
  fields:
    grace_seconds:
      name: Grace period (seconds)
      required: true
      default: 900
      selector:
        number:
          min: 0
          max: 86400
          mode: box
configure_job_defaults:
  name: Configure job defaults
  description: Set the robot-neutral values new jobs receive when they name none;
    existing jobs keep their values.
  fields:
    mode:
      name: Cleaning mode
      selector:
        select:
          options:
          - vacuum
          - mop
          - vacuum_and_mop
          - vacuum_then_mop
    vacuum_power:
      name: Vacuum power
      selector: *id001
    mop_intensity:
      name: Mop intensity
      selector: *water_levels
    mop_route:
      name: Mop route
      selector:
        select:
          options:
          - fast
          - standard
          - deep
          - deep_plus
    passes:
      name: Passes
      selector:
        number:
          min: 1
          max: 10
          mode: box
    settings_policy:
      name: Settings policy
      selector:
        select:
          options:
          - best_effort
          - strict
create_room:
  name: Create room
  description: Create a room, initially locked.
  fields:
    name:
      name: Name
      required: true
      selector:
        text: {}
    area_id:
      name: Home Assistant area ID
      required: false
      selector:
        text: {}
update_room:
  name: Update room
  description: Update room name, bindings, requirements or due policy. Cleaning history
    cannot be changed.
  fields:
    room_id: &id004
      name: Room ID
      required: true
      selector:
        text: {}
    configuration:
      name: Configuration
      required: true
      selector:
        object: {}
disable_room:
  name: Disable room
  description: Exclude a room from new jobs while preserving history and preventing
    automatic reimport.
  fields: &id005
    room_id: *id004
enable_room:
  name: Enable room
  description: Make a disabled room available for new jobs again.
  fields: *id005
release_room:
  name: Release room
  description: Allow new jobs permanently, for exactly one started job, for a duration,
    or until the current/next queue run ends.
  fields:
    room_id: *id004
    kind:
      name: Release type
      required: true
      selector:
        select:
          options:
          - permanent
          - once
          - timed
          - queue_run
    duration_seconds:
      name: Duration (timed only)
      selector:
        number:
          min: 0.001
          mode: box
revoke_room:
  name: Revoke room release
  description: Block new jobs. Already started jobs may finish all phases.
  fields: *id005
add_robot:
  name: Add robot
  description: Add a registered HA vacuum through the shared robot validator.
  fields:
    configuration:
      name: Configuration
      required: true
      selector:
        object: {}
configure_robot:
  name: Configure robot
  description: Update an idle robot, its roles, targets, requirements and supported
    preferences.
  fields:
    robot_id: &id006
      name: Robot ID
      required: true
      selector:
        text: {}
    configuration:
      name: Configuration
      required: true
      selector:
        object: {}
remove_robot:
  name: Remove robot
  description: Remove an idle profile and exclude it from automatic rediscovery.
  fields:
    robot_id: *id006
resolve_recovery:
  name: Resolve recovery
  description: Abandon uncertain work after a verified stop. Explicit confirmation
    attests a physical stop, including a removed robot. Never marks cleaning successful.
  fields:
    robot_id: *id006
    confirm_stopped:
      name: I verified that the robot is stopped
      default: false
      selector:
        boolean: {}
save_template:
  name: Save template
  description: Create or replace a reusable job intent. Automatic rules generate at
    most one demand per room and due episode.
  fields:
    template_id:
      name: Template ID (omit to create)
      required: false
      selector:
        text: {}
    name:
      name: Name
      required: true
      selector:
        text: {}
    intent:
      name: Job intent
      required: true
      selector:
        object: {}
    enabled:
      name: Enabled
      default: true
      selector:
        boolean: {}
    automatic:
      name: Create jobs when due
      default: false
      selector:
        boolean: {}
save_job_as_template:
  name: Save job as template
  description: Store a job's rooms, settings, title and note as a new enabled
    template. The occasion and the deduplication key are not copied.
  fields:
    job_id:
      name: Job ID
      required: true
      selector:
        text: {}
    name:
      name: Name
      required: true
      selector:
        text: {}
    automatic:
      name: Create jobs when due
      default: false
      selector:
        boolean: {}
remove_template:
  name: Remove template
  description: Remove a template while preserving already created jobs.
  fields: &id007
    template_id:
      name: Template ID
      required: true
      selector:
        text: {}
create_job_from_template:
  name: Create job from template
  description: Append an independent snapshot of the template intent to the queue.
  fields: *id007
reset_template_demand:
  name: Reset template demand
  description: Allow one new automatic demand per due room after a failed or cancelled
    demand. This does not start the queue.
  fields: *id007
get_rooms:
  name: Get rooms
  description: Return a bounded page of canonical rooms and due/release state.
  fields: &id010
    offset: &id011
      name: Offset
      default: 0
      selector: *id008
    limit: &id012
      name: Limit
      default: 50
      selector: *id009
get_robots:
  name: Get robots
  description: Return profiles, configuration and effective capabilities.
  fields: *id010
get_robot_candidates:
  name: Get robot candidates
  description: Discover registered vacuum entities and related roles.
  fields: *id010
get_templates:
  name: Get templates
  description: Return reusable intents and demand suppression.
  fields: *id010
get_history:
  name: Get history
  description: Return normalized cleaning runs and completion quality.
  fields: *id010
get_room:
  name: Get room
  description: Return room bindings, requirements, releases and cleaning evidence.
  fields: *id005
get_trace:
  name: Get trace
  description: Return bounded diagnostic events with sequence numbers.
  fields:
    offset: *id011
    limit: *id012
    job_id:
      name: Job ID
      required: false
      selector:
        text: {}
get_diagnostics:
  name: Get diagnostics
  description: Return a bounded, anonymized diagnostic export.
get_job_execution:
  name: Explain job execution
  description: Return current per-robot and per-operation blockers, resolved settings
    and attempt history without dispatching.
  fields:
    job_id:
      name: Job ID
      required: true
      selector:
        text: {}
preview_job:
  name: Preview job
  description: Resolve a job draft against the job defaults and robots without creating
    it. Returns the selectable settings, the values to preselect and whether the job
    could start now.
  fields:
    areas:
      name: Room or area IDs
      description: Optional while no room is chosen yet; "all" selects every active
        room.
      selector:
        object: {}
    mode:
      name: Cleaning mode
      selector:
        select:
          options:
          - vacuum
          - mop
          - vacuum_and_mop
          - vacuum_then_mop
    vacuum_power:
      name: Vacuum power
      selector: *id001
    mop_intensity:
      name: Mop intensity
      selector: *water_levels
    mop_route:
      name: Mop route
      selector:
        select:
          options:
          - fast
          - standard
          - deep
          - deep_plus
    passes:
      name: Passes
      selector:
        number:
          min: 1
          max: 10
          mode: box
    settings_policy:
      name: Settings policy
      selector:
        select:
          options:
          - best_effort
          - strict
    required_on:
      name: Required on
      selector:
        entity:
          multiple: true
    required_off:
      name: Required off
      selector:
        entity:
          multiple: true
    robot_id:
      name: Robot ID
      selector:
        text: {}
