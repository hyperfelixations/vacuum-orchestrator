name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: python -m pip install -r requirements-test.txt
      - run: python -m ruff format --check custom_components tests
      - run: python -m ruff check custom_components tests
      - run: python -m mypy custom_components
      - run: python -m pytest

  e2e-host:
    name: E2E host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-e2e.txt

      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m pytest -m e2e_host --no-cov tests/e2e_host
