# Version updates run on the 1st and 15th at 05:00 UTC: minor and major releases only, each at least
# 7 days old; majors stay single pull requests. Security updates are alert-driven and unaffected by
# schedule, cooldown and the patch rule. See internal dev doc "Abhängigkeiten und Lieferkette".
# Actions are pinned to commit SHAs; Dependabot moves the SHA and its version comment together.
# The Home Assistant test stack, core's Roborock requirements and the E2E host's pins move with
# the supported baseline: they get no version updates, only security updates.

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: cron
      cronjob: "0 5 1,15 * *"
    cooldown:
      default-days: 7
    groups:
      tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        applies-to: version-updates
      security:
        patterns: ["*"]
        applies-to: security-updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: homeassistant
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: pytest-homeassistant-custom-component
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: pytest
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: pytest-asyncio
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: pytest-cov
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # Core's Roborock requirements, as the tests run its methods (requirements-test.txt).
      - dependency-name: python-roborock
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: vacuum-map-parser-roborock
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # The E2E host's pins are HA's own (requirements-e2e.txt).
      - dependency-name: gazetteer-matcher
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: ha-ffmpeg
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: hassil
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: home-assistant-frontend
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: home-assistant-intents
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: infrared-protocols
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: mutagen
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: pymicro-vad
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: pyspeex-noise
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: PyTurboJPEG
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: rf-protocols
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 5 1,15 * *"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        applies-to: version-updates
      security:
        patterns: ["*"]
        applies-to: security-updates
